[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seclab"
version = "0.1.0"
description = "Small, dependency-free security helper scripts for a home-lab portfolio (auth.log summary, IOC extraction, hash checking)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Lucas" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
seclab-authlog = "seclab.authlog:main"
seclab-ioc = "seclab.ioc:main"
seclab-hashcheck = "seclab.hashcheck:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
