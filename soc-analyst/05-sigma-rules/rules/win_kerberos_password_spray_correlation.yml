title: Kerberos Pre-Authentication Failure Or Unknown Principal
id: 0b6f2a4e-8d7c-4e1a-9b3f-5c2d1e7a6f48
name: lucas_kerberos_preauth_failure
status: experimental
description: |
    Base rule - on a domain controller, a Kerberos TGT request that failed because
    the password was wrong (4771, 0x18) or the user does not exist (4768, 0x6).
    Used by the correlation below.
author: Lucas
date: 2026-09-27
tags:
    - attack.credential-access
    - attack.t1110.003
logsource:
    product: windows
    service: security
detection:
    wrong_password:
        EventID: 4771
        Status: '0x18'
    wrong_password_long:
        EventID: 4771
        Status: '0x00000018'
    unknown_user:
        EventID: 4768
        Status:
            - '0x6'
            - '0x00000006'
    condition: 1 of wrong_password* or unknown_user
falsepositives:
    - Users mistyping their password
level: informational
---
title: Kerberos Password Spraying - Many Distinct Users From One Source
id: 7e1c9d3a-2f4b-4a8e-b6d5-9a0c3e8f1b27
status: experimental
description: |
    Correlation rule - Kerberos pre-authentication failures or unknown-user TGT
    requests for 5 or more DIFFERENT accounts from the same source address within
    5 minutes. Counting distinct user names (not events) separates spraying (many
    users, few passwords) from one user mistyping a password many times.
references:
    - https://attack.mitre.org/techniques/T1110/003/
author: Lucas
date: 2026-09-27
tags:
    - attack.credential-access
    - attack.t1110.003
correlation:
    type: value_count
    rules:
        - lucas_kerberos_preauth_failure
    group-by:
        - IpAddress
    timespan: 5m
    condition:
        field: TargetUserName
        gte: 5
falsepositives:
    - Shared jump host or NAT address used by many users with expired passwords at the same time
level: high
