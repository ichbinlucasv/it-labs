title: Failed Windows Logon
id: 54b3edc9-1aa0-4b72-9bda-b685c7351e4a
name: lucas_failed_windows_logon
status: experimental
description: Base rule - a failed logon (4625) on a Windows host. Used by the correlation below.
author: Lucas
date: 2026-09-27
tags:
    - attack.credential-access
    - attack.t1110
