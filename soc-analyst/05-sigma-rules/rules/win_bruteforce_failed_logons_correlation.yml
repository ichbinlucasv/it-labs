title: Many Failed Logons From One Source (Brute Force / Password Guessing)
id: 5d0f7c1e-3a8b-4c2e-9f61-2b7d4e8a9c10
status: experimental
description: |
    Correlation rule - 10 or more failed logons (4625) from the same source IP address
    within 5 minutes. Tune the threshold to your environment.
references:
    - https://attack.mitre.org/techniques/T1110/001/
author: Lucas
date: 2026-09-27
tags:
    - attack.credential-access
    - attack.t1110.001
correlation:
    type: event_count
    rules:
        - lucas_failed_windows_logon
    group-by:
        - IpAddress
    timespan: 5m
    condition:
        gte: 10
falsepositives:
    - Misconfigured service or mapped drive using an old password (usually a single account)
level: medium
